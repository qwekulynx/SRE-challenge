name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ==========================================================
  # 1. Infrastructure with Terraform
  # ==========================================================
  infra:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb
          DEBUG: 1
        options: >-
          --health-cmd="curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack..."

          for i in {1..15}; do
            if curl -s http://localhost:4566/_localstack/health | grep '"s3": "running"'; then
              echo "LocalStack is ready!"
              exit 0
            fi

            echo "LocalStack not ready yet..."
            sleep 5
          done

          echo "LocalStack failed to become ready."
          exit 1

      - name: Initialize Terraform
        working-directory: infra/terraform
        run: terraform init

      - name: Validate Terraform
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        working-directory: infra/terraform
        run: terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: infra/terraform
        run: terraform apply -auto-approve

      - name: Verify LocalStack Resources
        run: |
          echo "Checking S3 resources..."
          aws --endpoint-url=http://localhost:4566 s3 ls || true

          echo "Checking DynamoDB resources..."
          aws --endpoint-url=http://localhost:4566 dynamodb list-tables || true


  # ==========================================================
  # 2. Run Tests
  # ==========================================================
  test:
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/src/requirements.txt
          pip install pytest httpx

      - name: Run Unit Tests
        working-directory: app
        env:
          PYTHONPATH: ./src
        run: |
          pytest -q


  # ==========================================================
  # 3. Build and Push Docker Image
  # ==========================================================
  docker:
    runs-on: ubuntu-latest
    needs: test

    # Do not push Docker images from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        working-directory: app
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/prima-app

          echo "Building image..."
          echo "$IMAGE:${{ github.sha }}"

          docker build \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} \
            .

      - name: Push Docker Image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/prima-app

          echo "Pushing latest image..."
          docker push $IMAGE:latest

          echo "Pushing commit-specific image..."
          docker push $IMAGE:${{ github.sha }}


  # ==========================================================
  # 4. Deploy to Kubernetes with Helm + kind
  # ==========================================================
  deploy:
    runs-on: ubuntu-latest
    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Create local Kubernetes cluster
      # ------------------------------------------------------
      - name: Set up kind Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: prima-cluster

      # ------------------------------------------------------
      # Install Helm
      # ------------------------------------------------------
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.4"

      # ------------------------------------------------------
      # Verify Kubernetes cluster
      # ------------------------------------------------------
      - name: Verify Kubernetes Cluster
        run: |
          echo "Kubernetes cluster information:"
          kubectl cluster-info

          echo ""
          echo "Kubernetes nodes:"
          kubectl get nodes -o wide

      # ------------------------------------------------------
      # Optional DockerHub login
      #
      # This is useful if your DockerHub repository is private.
      # ------------------------------------------------------
      - name: Create DockerHub Pull Secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKER_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_PASSWORD }}" \
            --docker-email="github-actions@example.com" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ------------------------------------------------------
      # Check Helm chart
      # ------------------------------------------------------
      - name: Lint Helm Chart
        run: |
          helm lint ./k8s/helm-chart

      # ------------------------------------------------------
      # Render templates before deployment
      # ------------------------------------------------------
      - name: Test Helm Templates
        run: |
          helm template prima-app ./k8s/helm-chart \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/prima-app \
            --set image.tag=${{ github.sha }}

      # ------------------------------------------------------
      # Deploy application
      # ------------------------------------------------------
      - name: Deploy with Helm
        run: |
          helm upgrade --install prima-app ./k8s/helm-chart \
            --namespace default \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/prima-app \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 3m

      # ------------------------------------------------------
      # Show Helm release
      # ------------------------------------------------------
      - name: Verify Helm Release
        run: |
          echo "Helm releases:"
          helm list -A

          echo ""
          echo "Helm release status:"
          helm status prima-app

      # ------------------------------------------------------
      # Show all deployed Kubernetes resources
      # ------------------------------------------------------
      - name: Inspect Kubernetes Resources
        if: always()
        run: |
          echo "================================"
          echo "NODES"
          echo "================================"
          kubectl get nodes -o wide || true

          echo ""
          echo "================================"
          echo "PODS"
          echo "================================"
          kubectl get pods -A -o wide || true

          echo ""
          echo "================================"
          echo "DEPLOYMENTS"
          echo "================================"
          kubectl get deployments -A || true

          echo ""
          echo "================================"
          echo "SERVICES"
          echo "================================"
          kubectl get services -A || true

          echo ""
          echo "================================"
          echo "REPLICASETS"
          echo "================================"
          kubectl get replicasets -A || true

      # ------------------------------------------------------
      # Verify Deployment
      #
      # Does not assume that the Helm-generated Deployment
      # is necessarily called "prima-app".
      # ------------------------------------------------------
      - name: Verify Deployment
        run: |
          echo "Finding deployment created by Helm..."

          DEPLOYMENT=$(kubectl get deployments \
            -l app.kubernetes.io/instance=prima-app \
            -o jsonpath='{.items[0].metadata.name}')

          if [ -z "$DEPLOYMENT" ]; then
            echo "Could not find a deployment using Helm release label."

            echo ""
            echo "Available deployments:"
            kubectl get deployments -A

            exit 1
          fi

          echo "Deployment found: $DEPLOYMENT"

          kubectl rollout status \
            deployment/$DEPLOYMENT \
            --timeout=120s

      # ------------------------------------------------------
      # Verify Pods
      # ------------------------------------------------------
      - name: Verify Pods
        run: |
          echo "Application pods:"
          kubectl get pods \
            -l app.kubernetes.io/instance=prima-app \
            -o wide

      # ------------------------------------------------------
      # Debug automatically when deployment fails
      # ------------------------------------------------------
      - name: Kubernetes Debug Information
        if: failure()
        run: |
          echo "================================"
          echo "KUBERNETES EVENTS"
          echo "================================"
          kubectl get events -A \
            --sort-by='.lastTimestamp' || true

          echo ""
          echo "================================"
          echo "PODS"
          echo "================================"
          kubectl get pods -A -o wide || true

          echo ""
          echo "================================"
          echo "POD DESCRIPTIONS"
          echo "================================"

          for pod in $(kubectl get pods \
            -l app.kubernetes.io/instance=prima-app \
            -o jsonpath='{.items[*].metadata.name}'); do

            echo ""
            echo "----- $pod -----"
            kubectl describe pod "$pod" || true

          done

          echo ""
          echo "================================"
          echo "POD LOGS"
          echo "================================"

          for pod in $(kubectl get pods \
            -l app.kubernetes.io/instance=prima-app \
            -o jsonpath='{.items[*].metadata.name}'); do

            echo ""
            echo "----- Logs for $pod -----"
            kubectl logs "$pod" --all-containers=true || true

          done
